name: Test
description: "Run unit tests for the Fabric CICD project 2"

on:
    pull_request:
        branches: ["main"]
        types: [opened, edited, synchronize, ready_for_review]
    push:
        branches: ["main"]

jobs:
    unit_test:
        name: Unit Test (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run unit tests
              env:
                  # Override .python-version and pyproject's python-preference so uv uses the matrix interpreter
                  UV_PYTHON: ${{ matrix.python-version }}
                  UV_PYTHON_PREFERENCE: only-system
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv sync --dev
                  uv run python --version
                  uv run pytest -v || exit 1  # Fail the job if any tests fail
