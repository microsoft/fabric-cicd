name: "AI Issue Triage"

# Agentic, tool-grounded triage on first-party GitHub Models.
#
# The heavy lifting lives in .github/triage-tools/orchestrate.mjs, which runs a deterministic
# pipeline (classify -> tools -> analyze/answer/misconfig -> comment-draft -> critique) and
# emits a single decision JSON. This workflow only wires I/O: resolve the issue, run the
# orchestrator, then label / comment / close based on the decision (respecting the dry-run
# flags below). No third-party marketplace actions and no external model providers.

on:
    issues:
        # `opened`  -> triage brand-new issues automatically.
        # `labeled` -> manual/humans re-enter triage by adding `needs triage`.
        types: [opened, labeled]
    workflow_dispatch:
        inputs:
            issue_number:
                description: "Issue number to triage"
                required: true
                type: number
            enable_handoff:
                description: "Arm Tier-2 handoff: assign the Copilot coding agent when the issue is eligible"
                required: false
                default: false
                type: boolean
            force_handoff:
                description: "Bypass the eligibility gate and force the handoff (manual testing only; needs enable_handoff)"
                required: false
                default: false
                type: boolean

# One triage run per issue at a time; a newer event supersedes an in-flight run.
concurrency:
    group: ai-triage-${{ github.event.issue.number || github.event.inputs.issue_number }}
    cancel-in-progress: true

jobs:
    ai-triage:
        # Run for: manual dispatch, any newly opened issue, or the `needs triage` label.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.action == 'opened' ||
            (github.event.action == 'labeled' && github.event.label.name == 'needs triage')
        runs-on: ubuntu-latest
        permissions:
            issues: write
            models: read
            contents: read

        env:
            # -------------------------------------------------------
            # Phase control — toggle these flags to switch phases:
            #   Testing (fork):   suppress both  → true  / true
            #   Production:       enable both    → false / false
            # -------------------------------------------------------
            SUPPRESS_LABELS: "false"
            SUPPRESS_COMMENTS: "false"
            # Tier-2 handoff to the Copilot coding agent (off by default — opt-in only).
            # A workflow_dispatch run can arm it per-run via the `enable_handoff` input,
            # without changing the branch defaults (e.g. the suppressed fork-dry-run branch).
            ENABLE_CODING_AGENT_HANDOFF: ${{ inputs.enable_handoff || false }}
            # Silence Node's harmless DEP0040 punycode deprecation warning (emitted by Node core's
            # URL/fetch stack, not our code) so it doesn't clutter the triage logs.
            NODE_OPTIONS: "--no-deprecation"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install triage tool dependencies
              run: npm install --prefix .github/triage-tools --no-audit --no-fund

            - name: Resolve issue details
              id: issue
              uses: actions/github-script@v7
              with:
                  script: |
                      const issueNumber = context.payload.issue?.number || ${{ inputs.issue_number || 0 }};
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;

                      const { data: issue } = await github.rest.issues.get({
                        owner, repo, issue_number: issueNumber,
                      });

                      // Detect re-triage: prior ai: labels or a prior AI assessment comment.
                      const hasAiLabels = issue.labels.some(l => (l.name || l).startsWith('ai:'));
                      const { data: comments } = await github.rest.issues.listComments({
                        owner, repo, issue_number: issueNumber, per_page: 100,
                      });
                      const hasAiComment = comments.some(c =>
                        c.body && c.body.includes('### AI Assessment:')
                      );

                      const isRetriage = hasAiLabels || hasAiComment;
                      let issueBody = issue.body || '';

                      if (isRetriage) {
                        const lastAiIdx = comments.reduce((acc, c, i) =>
                          c.body && c.body.includes('### AI Assessment:') ? i : acc, -1);
                        const authorReplies = comments
                          .slice(lastAiIdx + 1)
                          .filter(c => c.user.login === issue.user.login)
                          .map(c => c.body)
                          .join('\n\n---\n\n');
                        if (authorReplies) {
                          issueBody = `[RE-TRIAGE] The author has provided additional information in response to a prior AI assessment.\n\n`
                            + `## Original Issue Summary\n${issue.title}\n\n`
                            + `## Author's Follow-up Response\n${authorReplies}\n\n`
                            + `Focus your assessment on the new information provided above. Reference the original issue only if needed for context.`;
                        }
                      }

                      core.setOutput('number', issue.number);
                      core.setOutput('title', issue.title);
                      core.setOutput('author', issue.user.login);
                      core.setOutput('html_url', issue.html_url);
                      core.setOutput('is_retriage', isRetriage.toString());
                      // Body can be large / multiline — pass via env file rather than an output.
                      const fs = require('fs');
                      fs.writeFileSync('triage-issue-body.txt', issueBody);

            - name: Run orchestrator
              id: orchestrate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
                  ISSUE_TITLE: ${{ steps.issue.outputs.title }}
                  ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
                  DECISION_OUT: triage-decision.json
              run: |
                  ISSUE_BODY="$(cat triage-issue-body.txt)" \
                    node .github/triage-tools/orchestrate.mjs > /dev/null
                  echo "Decision written to triage-decision.json"
                  test -s triage-decision.json && echo "have_decision=true" >> "$GITHUB_OUTPUT"

            - name: Apply triage decision
              if: steps.orchestrate.outputs.have_decision == 'true'
              uses: actions/github-script@v7
              env:
                  SUPPRESS_LABELS: ${{ env.SUPPRESS_LABELS }}
                  SUPPRESS_COMMENTS: ${{ env.SUPPRESS_COMMENTS }}
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const decision = JSON.parse(fs.readFileSync('triage-decision.json', 'utf8'));
                      const issueNumber = parseInt(process.env.ISSUE_NUMBER);
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const suppressLabels = process.env.SUPPRESS_LABELS === 'true';
                      const suppressComments = process.env.SUPPRESS_COMMENTS === 'true';

                      core.info(`Decision: category=${decision.category} confidence=${decision.confidence} ` +
                        `resolution=${decision.resolution} can_auto_close=${decision.can_auto_close}`);

                      // Persist the decision for the summary/handoff steps.
                      core.exportVariable('TRIAGE_DECISION', JSON.stringify(decision));

                      // --- Comment (respect dry-run) ---
                      if (!suppressComments && decision.comment_markdown) {
                        await github.rest.issues.createComment({
                          owner, repo, issue_number: issueNumber, body: decision.comment_markdown,
                        });
                        core.info('Posted AI assessment comment.');
                      } else {
                        core.info('Comments suppressed — skipping comment.');
                      }

                      if (suppressLabels) {
                        core.info('Labels suppressed — logging decisions only.');
                        return;
                      }

                      // --- Labels ---
                      const labels = Array.isArray(decision.labels) ? decision.labels : [];
                      if (labels.length) {
                        try {
                          await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels });
                          core.info(`Added labels: ${labels.join(', ')}`);
                        } catch (e) { core.info(`Could not add labels: ${e.message}`); }
                      }

                      // --- Escalate to team ---
                      if (decision.needs_human_review) {
                        try {
                          await github.rest.issues.addLabels({
                            owner, repo, issue_number: issueNumber, labels: ['ai:needs team attention'],
                          });
                        } catch (e) { core.info(`Could not add attention label: ${e.message}`); }
                        if (!suppressComments) {
                          await github.rest.issues.createComment({
                            owner, repo, issue_number: issueNumber,
                            body: '🔔 @microsoft/fabric-cicd — This issue has been flagged by AI triage as requiring team attention. Please review the assessment above.',
                          });
                        }
                        core.info('Escalated to team.');
                      }

                      // --- Auto-close (confidence-gated inside the orchestrator) ---
                      if (decision.can_auto_close) {
                        await github.rest.issues.update({
                          owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'completed',
                        });
                        core.info('Auto-closed — AI fully resolved it above the confidence threshold.');
                      }

                      // --- Always remove 'needs triage' — triage is complete ---
                      try {
                        await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'needs triage' });
                        core.info("Removed 'needs triage' — triage complete.");
                      } catch (e) {
                        core.info(`Could not remove 'needs triage' label: ${e.message}`);
                      }

            - name: Hand off to coding agent (Tier-2, opt-in)
              if: steps.orchestrate.outputs.have_decision == 'true' && env.ENABLE_CODING_AGENT_HANDOFF == 'true'
              uses: actions/github-script@v7
              env:
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
                  FORCE_HANDOFF: ${{ inputs.force_handoff || false }}
                  SUPPRESS_LABELS: ${{ env.SUPPRESS_LABELS }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const decision = JSON.parse(fs.readFileSync('triage-decision.json', 'utf8'));
                      const issueNumber = parseInt(process.env.ISSUE_NUMBER);
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const force = process.env.FORCE_HANDOFF === 'true';
                      const suppressLabels = process.env.SUPPRESS_LABELS === 'true';

                      // Only hand off clear, non-critical, high-confidence bugs with a reproduction and
                      // a concrete failure signal — never features, questions, or duplicates.
                      const hasRepro = Boolean(decision.tool_findings?.error_log?.primary_exception)
                        || Boolean(decision.tool_findings?.error_log?.has_error);
                      const eligible = decision.category === 'bug'
                        && decision.severity !== 'critical'
                        && (decision.confidence || 0) >= 0.85
                        && !decision.is_duplicate_of
                        && decision.resolution !== 'misconfiguration'
                        && hasRepro;

                      if (!eligible && !force) {
                        core.info('Not eligible for coding-agent handoff — skipping.');
                        return;
                      }
                      if (!eligible && force) {
                        core.info('Eligibility gate bypassed via force_handoff (manual test) — proceeding.');
                      }

                      // Best-effort assignment of the Copilot coding agent via GraphQL. Falls back to a
                      // label + comment if the agent is unavailable in this repo. Never fails the run.
                      try {
                        const q = `query($owner:String!,$repo:String!){
                          repository(owner:$owner,name:$repo){
                            id
                            suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:50){
                              nodes { login __typename ... on Bot { id } ... on User { id } }
                            }
                          }
                        }`;
                        const data = await github.graphql(q, { owner, repo });
                        const bot = data.repository.suggestedActors.nodes.find(n => n.login === 'copilot-swe-agent' || n.login === 'Copilot');
                        const issueNode = await github.graphql(
                          `query($owner:String!,$repo:String!,$n:Int!){repository(owner:$owner,name:$repo){issue(number:$n){id}}}`,
                          { owner, repo, n: issueNumber });
                        if (bot && issueNode.repository.issue.id) {
                          await github.graphql(
                            `mutation($assignable:ID!,$actor:ID!){replaceActorsForAssignable(input:{assignableId:$assignable,actorIds:[$actor]}){clientMutationId}}`,
                            { assignable: issueNode.repository.issue.id, actor: bot.id });
                          core.info('Assigned issue to the Copilot coding agent.');
                          return;
                        }
                        throw new Error('Copilot coding agent not available as an assignable actor.');
                      } catch (e) {
                        core.info(`Coding-agent assignment unavailable (${e.message}); labelling for manual pickup.`);
                        if (suppressLabels) {
                          core.info('Labels suppressed — skipping the "ready for coding agent" fallback label.');
                          return;
                        }
                        try {
                          await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['ready for coding agent'] });
                        } catch (e2) { core.info(`Could not add handoff label: ${e2.message}`); }
                      }

            - name: Generate triage summary
              if: always() && steps.orchestrate.outputs.have_decision == 'true'
              uses: actions/github-script@v7
              env:
                  ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
                  ISSUE_TITLE: ${{ steps.issue.outputs.title }}
                  ISSUE_URL: ${{ steps.issue.outputs.html_url }}
                  SUPPRESS_LABELS: ${{ env.SUPPRESS_LABELS }}
              with:
                  script: |
                      const fs = require('fs');
                      const decision = JSON.parse(fs.readFileSync('triage-decision.json', 'utf8'));
                      const issueNumber = process.env.ISSUE_NUMBER;
                      const issueTitle = process.env.ISSUE_TITLE;
                      const issueUrl = process.env.ISSUE_URL;
                      const suppressLabels = process.env.SUPPRESS_LABELS === 'true';

                      const tf = decision.tool_findings || {};
                      const exc = tf.error_log?.primary_exception;
                      let summary = `## 🤖 AI Triage Report\n\n`;
                      summary += `**Issue:** [#${issueNumber} — ${issueTitle}](${issueUrl})\n\n`;
                      summary += `| Field | Value |\n|-------|-------|\n`;
                      summary += `| Category | \`${decision.category}\` |\n`;
                      summary += `| Confidence | ${decision.confidence} (threshold ${decision.confidence_threshold}) |\n`;
                      summary += `| Severity | \`${decision.severity}\` |\n`;
                      summary += `| Resolution | \`${decision.resolution}\` |\n`;
                      summary += `| Labels | ${(decision.labels||[]).map(l => '`'+l+'`').join(', ') || '—'} |\n`;
                      summary += `| Duplicate of | ${decision.is_duplicate_of ? '#'+decision.is_duplicate_of : '—'} |\n`;
                      summary += `| Auto-close | ${decision.can_auto_close ? '✅ Yes' : '❌ No'} |\n`;
                      summary += `| Escalated | ${decision.needs_human_review ? '✅ Yes' : '❌ No'} |\n\n`;

                      summary += `### 🔧 Tool grounding\n\n`;
                      summary += `- Exception: ${exc ? '`'+exc.type+'`: '+exc.message : '—'}\n`;
                      summary += `- HTTP status: ${tf.error_log?.http_status ?? '—'}\n`;
                      summary += `- Version: reported \`${tf.version?.reported_version ?? '—'}\`, latest \`${tf.version?.latest_version ?? '—'}\`${tf.version?.is_stale ? ' (stale)' : ''}\n`;
                      summary += `- Duplicate candidate: ${tf.duplicates?.likely_duplicate_of ? '#'+tf.duplicates.likely_duplicate_of : '—'}\n`;
                      const unknown = (tf.symbols||[]).filter(s => !s.exists);
                      summary += `- Unknown symbols flagged: ${unknown.length ? unknown.map(s => '`'+s.name+'`').join(', ') : '—'}\n\n`;

                      summary += `### 🧠 Pipeline\n\n`;
                      summary += `- Stages: ${(decision.stages||[]).join(' → ') || '—'}\n`;
                      summary += `- Models: ${(decision.models_used||[]).map(m => '`'+m+'`').join(', ') || '—'}\n`;
                      if (decision.degraded) summary += `- ⚠️ Ran in degraded mode (no model token).\n`;
                      summary += `\n`;

                      if (suppressLabels) {
                        summary += `### 🏷️ Label Decisions (not applied — testing mode)\n\n`;
                        summary += `| Decision | Value |\n|----------|-------|\n`;
                        summary += `| Would add labels | ${(decision.labels||[]).map(l => '`'+l+'`').join(', ') || '—'} |\n`;
                        summary += `| Would add \`help wanted\` | ${decision.add_help_wanted ? '✅ Yes' : '❌ No'} |\n`;
                        summary += `| Would add \`ai:needs team attention\` | ${decision.needs_human_review ? '✅ Yes' : '❌ No'} |\n`;
                        summary += `| Would request author feedback | ${decision.needs_author_feedback ? '✅ Yes' : '❌ No'} |\n`;
                        summary += `| Would auto-close | ${decision.can_auto_close ? '✅ Yes' : '❌ No'} |\n\n`;
                      }

                      summary += `<details><summary>Proposed comment</summary>\n\n${decision.comment_markdown || '_none_'}\n\n</details>\n\n---\n\n`;

                      core.summary.addRaw(summary);
                      await core.summary.write();

                      fs.mkdirSync('triage-reports', { recursive: true });
                      fs.writeFileSync(`triage-reports/issue-${issueNumber}-triage.md`, summary);
                      fs.copyFileSync('triage-decision.json', `triage-reports/issue-${issueNumber}-decision.json`);

            - name: Upload triage report
              if: always() && steps.orchestrate.outputs.have_decision == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: triage-report-issue-${{ steps.issue.outputs.number }}
                  path: triage-reports/
                  retention-days: 30
